spring:
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: file:database/liquibase/db.changelog-master.yaml

server:
  error:
    include-message: always

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  paths-to-match: /api/**
  packages-to-scan: com.example.identity.auth
