name: Publish API docs

on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-identity-api-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Export OpenAPI JSON
        run: ./gradlew openapi --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1 lint

      - name: Build Redoc site
        run: |
          mkdir -p _site
          cp build/openapi/openapi.json _site/openapi.json
          npx --yes @redocly/cli@1 openapi build-docs build/openapi/openapi.json \
            -o _site/index.html \
            --title "Identity Service API"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
