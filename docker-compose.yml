services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity_app
      POSTGRES_PASSWORD: identity_app
      POSTGRES_DB: identity_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_app -d identity_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/identity_service
      DB_USERNAME: identity_app
      DB_PASSWORD: identity_app
    depends_on:
      postgres:
        condition: service_healthy
